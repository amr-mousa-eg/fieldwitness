[project]
name = "fieldwitness"
version = "0.1.0"
description = "Crop rotation decision support backed by physics, a field's own satellite history and its neighbours."
requires-python = ">=3.12,<3.13"
dependencies = [
    "earthaccess>=0.19.0",
    "geopandas>=1.2.0",
    "h5netcdf[h5py]>=1.8.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Never reformat code blocks in docs (PLAN.md §3 is a contract) or the vendored skill folders.
extend-exclude = ["*.md", ".agents", ".claude"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pre-commit>=4.7.0",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
