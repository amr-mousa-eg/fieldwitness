# Netlify (PREPARED, NOT DEPLOYED). Netlify reads this file when the site's "Base directory" is `app`.
# Route A (no packs in git): build locally, then drag app/dist onto the Netlify UI ("Deploy manually").
#   This file is then not used.
# Route B (Git-linked site): needs the packs inside the repo. Set FW_PACKS to their folder relative
#   to app/ (default ../packs/demo, the only packs folder .gitignore lets into git).
# Hash routing (#/region/field): no redirect rules needed.

[build]
  base = "app"
  command = "node scripts/sync-packs.mjs \"${FW_PACKS:-../packs/demo}\" && npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node ^20.19 || >=22.12; vitest 5 needs ^22.12 || ^24
  NODE_VERSION = "22"
  VITE_BASE = "/"

# Always fetch a fresh service worker, so a new deploy reaches returning visitors.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
