# GitHub Pages workflow (PREPARED, NOT ACTIVE). To use it, copy it to .github/workflows/pages.yml on
# the default branch, and set Settings > Pages > Source = "GitHub Actions".
# Requires a PUBLIC repo on GitHub Free (Pages in private repos needs a paid plan; see
# app/deploy/README.md). Manual trigger only, so nothing deploys by accident.
# Action versions and permissions from docs.github.com "Using custom workflows with GitHub Pages"
# (checked 2026-11-07).
name: Deploy app to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Packs folder, relative to the repo root (must be committed)"
        default: "packs/demo"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node scripts/sync-packs.mjs "../${{ inputs.packs }}"
      # Project site: https://<owner>.github.io/<repo>/
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
