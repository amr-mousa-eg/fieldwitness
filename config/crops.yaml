    stage_lengths_days:
      fr_toulouse_t31tcj: {value: null, verified: false, note: "FAO-56 Table 11 has no rapeseed row; UNVERIFIED (tag A)."}
      ua_central_t36uvu: {value: null, verified: false, note: "FAO-56 Table 11 has no rapeseed row; UNVERIFIED (tag A)."}
    family: {value: null, verified: false, note: "No scientific name from FAO-66, and GBIF vernacular search and USDA PLANTS common names did not agree on one (2026-11-04); UNVERIFIED."}

