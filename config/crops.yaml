    label_aliases: {CSB: ["Winter Wheat"]}
    kc_ini:
      frozen_soils: {value: 0.4, ref: {source: fao56_ch6, table: 12, row: "Winter Wheat - with frozen soils"}, verified: true}
      non_frozen_soils: {value: 0.7, ref: {source: fao56_ch6, table: 12, row: "Winter Wheat - with non-frozen soils"}, verified: true}
      by_region: {ks_t14slh: frozen_soils, ua_central_t36uvu: frozen_soils, fr_toulouse_t31tcj: non_frozen_soils}
      choice: "Region → frozen/non-frozen soils is a team assumption (A)."
    kc_mid: {value: 1.15, ref: {source: fao56_ch6, table: 12, row: "Winter Wheat"}, verified: true}
    kc_end: {value: 0.25, range: [0.25, 0.4], ref: {source: fao56_ch6, table: 12, row: "Winter Wheat", footnote: 10}, verified: true,
             choice: "Footnote 10: the higher value is for hand-harvested crops; machine harvest assumed (A)."}
    h_max_m: {value: 1, ref: {source: fao56_ch6, table: 12, row: "Winter Wheat - with frozen soils"}, verified: true}
    root_depth_m: {range: [1.5, 1.8], ref: {source: fao56_ch8, table: 22, row: "Winter Wheat"}, verified: true}
    p: {value: 0.55, ref: {source: fao56_ch8, table: 22, row: "Winter Wheat", note: "for ET ≈ 5 mm/day"}, verified: true}
    ky: {value: 1.05, ref: {source: fao56_ch8, table: 24, row: "Winter wheat", note: "from FAO-33"}, verified: true}
    stage_lengths_days:
      ks_t14slh: {value: [160, 75, 75, 25], ref: {source: fao56_ch6, table: 11, row: "Winter Wheat | October | Idaho, USA"}, verified: true,
                  choice: "Continental row with winter dormancy, closest to Kansas (A)."}
      fr_toulouse_t31tcj: {value: [30, 140, 40, 30], ref: {source: fao56_ch6, table: 11, row: "Winter Wheat | November | Mediterranean"}, verified: true,
                           choice: "Mediterranean row, closest to Toulouse (A)."}
      ua_central_t36uvu: {value: [160, 75, 75, 25], ref: {source: fao56_ch6, table: 11, row: "Winter Wheat | October | Idaho, USA"}, verified: true,
                          choice: "Continental row with winter dormancy, closest to central Ukraine (A)."}
    family: {value: Poaceae, verified: true, ref: {source: gbif_backbone, usage_key: 7795888, scientific_name: "Triticum aestivum L.", match_type: EXACT, name_source: "FAO-66 (Steduto et al. 2012), PDF p. 107", usda_symbol: TRAE, usda_family_agrees: true, accessed: 2026-11-04}}

  winter_barley:
    name: Winter barley
    mvp_role: prediction_only  # Ky unverified -> no RYI; in hindcast predictions (Kc + stages), not an MVP rotation option (user 2026-11-04).
    hcat3: ["3301010401"]  # winter_barley
    kc_ini: {value: 0.3, ref: {source: fao56_ch6, table: 12, row: "i. Cereals (group row, Kc ini)", footnote: 1}, verified: true}
    kc_mid: {value: 1.15, ref: {source: fao56_ch6, table: 12, row: "Barley"}, verified: true}
    kc_end: {value: 0.25, ref: {source: fao56_ch6, table: 12, row: "Barley"}, verified: true}
    h_max_m: {value: 1, ref: {source: fao56_ch6, table: 12, row: "Barley"}, verified: true}
    root_depth_m: {range: [1.0, 1.5], ref: {source: fao56_ch8, table: 22, row: "Barley"}, verified: true}
    p: {value: 0.55, ref: {source: fao56_ch8, table: 22, row: "Barley", note: "for ET ≈ 5 mm/day"}, verified: true}
    ky: {value: null, verified: false, note: "Not in FAO-56 Table 24. FAO-66 (Steduto et al. 2012, https://www.fao.org/4/i2800e/i2800e.pdf) read with pypdf on 2026-11-04: the barley section (printed pp. 134-141, PDF pp. 149-156) gives no Ky, and Table 2 (printed p. 12, PDF p. 27) has no barley row. UNVERIFIED (tag A)."}
    stage_lengths_days:
      ua_central_t36uvu: {value: [160, 75, 75, 25], ref: {source: fao56_ch6, table: 11, row: "Winter Wheat | October | Idaho, USA"}, verified: true,
                          choice: "No continental winter-barley row; continental winter-wheat row used as proxy (A)."}
      fr_toulouse_t31tcj: {value: [30, 140, 40, 30], ref: {source: fao56_ch6, table: 11, row: "Winter Wheat | November | Mediterranean"}, verified: true,
                           choice: "No Mediterranean winter-barley row (Barley/Oats/Wheat rows are other climates; two have no region printed). Winter wheat row used as proxy (A)."}
    family: {value: Poaceae, verified: true, ref: {source: gbif_backbone, usage_key: 2706056, scientific_name: "Hordeum vulgare L.", match_type: EXACT, name_source: "FAO-66 (Steduto et al. 2012), PDF p. 149", usda_symbol: HOVU, usda_family_agrees: true, accessed: 2026-11-04}}

