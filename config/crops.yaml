# Crop parameters for the FAO-56 water balance (PLAN.md §4, T0.6).
#
# Values were read on 2026-11-04 from the official FAO-56 HTML edition with
# scripts/extract_fao56.py (cells copied as text; footnote marks kept apart). Each parameter has
#   value | range  — the number(s) as printed (range = [first, second] as printed)
#   ref           — source id, table, row label as printed (and footnote)
#   verified      — true: read from the cited table; false: not from a paper (shown as tag A)
#   choice        — why a value was picked inside a published range (a team choice, tag A)
# Page numbers: the FAO-56 HTML edition has no printed page numbers, so refs cite the chapter page
# URL. FAO-33 itself was not found on fao.org; Ky comes from FAO-56 Table 24, which reproduces
# FAO-33 seasonal values. FAO-66 (https://www.fao.org/4/i2800e/i2800e.pdf) was read with pypdf
# (dev dependency) and has no Ky for barley or rapeseed, so those stay unverified (null, tag A).

sources:
  fao56_ch6:
    citation: "Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56, Chapter 6"
    url: https://www.fao.org/4/x0490e/x0490e0b.htm
  fao56_ch8:
    citation: "Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop evapotranspiration. FAO Irrigation and Drainage Paper 56, Chapter 8"
    url: https://www.fao.org/4/x0490e/x0490e0e.htm
  gbif_backbone:
    citation: "GBIF Backbone Taxonomy via the GBIF species-match API (api.gbif.org/v1/species/match); family cross-checked with the USDA NRCS PLANTS Database API (plantsservices.sc.egov.usda.gov). Accessed 2026-11-04."
    url: https://api.gbif.org/v1/species/match

crops:
  maize:
    name: Maize, field (grain)
    mvp_role: rotation
    hcat3: ["3301010600"]  # grain_maize_corn_popcorn
    label_aliases: {CSB: ["Corn"]}
    kc_ini: {value: 0.3, ref: {source: fao56_ch6, table: 12, row: "i. Cereals (group row, Kc ini)", footnote: 1}, verified: true}
    kc_mid: {value: 1.20, ref: {source: fao56_ch6, table: 12, row: "Maize, Field (grain) (field corn)"}, verified: true}
    kc_end: {value: 0.35, range: [0.60, 0.35], ref: {source: fao56_ch6, table: 12, row: "Maize, Field (grain) (field corn)", footnote: 11}, verified: true,
             choice: "Footnote 11: second value = harvest after complete field drying of the grain; dry grain harvest assumed (A)."}
    h_max_m: {value: 2, ref: {source: fao56_ch6, table: 12, row: "Maize, Field (grain) (field corn)"}, verified: true}
    root_depth_m: {range: [1.0, 1.7], ref: {source: fao56_ch8, table: 22, row: "Maize, Field (grain) (field corn)"}, verified: true}
    p: {value: 0.55, ref: {source: fao56_ch8, table: 22, row: "Maize, Field (grain) (field corn)", note: "for ET ≈ 5 mm/day"}, verified: true}
    ky: {value: 1.25, ref: {source: fao56_ch8, table: 24, row: "Maize", note: "from FAO-33"}, verified: true}
    stage_lengths_days:
      ks_t14slh: {value: [30, 40, 50, 50], ref: {source: fao56_ch6, table: 11, row: "Maize (grain) | April | Idaho, USA"}, verified: true,
                  choice: "Closest continental US row to SW Kansas (A)."}
      fr_toulouse_t31tcj: {value: [30, 40, 50, 30], ref: {source: fao56_ch6, table: 11, row: "Maize (grain) | April | Spain (spr, sum.); Calif."}, verified: true,
                           choice: "Closest southern-European row to Toulouse (A)."}
      ua_central_t36uvu: {value: [30, 40, 50, 50], ref: {source: fao56_ch6, table: 11, row: "Maize (grain) | April | Idaho, USA"}, verified: true,
                          choice: "Continental row, closest to central Ukraine (A)."}
    family: {value: Poaceae, verified: true, ref: {source: gbif_backbone, usage_key: 5290052, scientific_name: "Zea mays L.", match_type: EXACT, name_source: "FAO-66 (Steduto et al. 2012), PDF p. 129", usda_symbol: ZEMA, usda_family_agrees: true, accessed: 2026-11-04}}

  sorghum:
    name: Sorghum (grain)
    mvp_role: rotation
    hcat3: ["3301010900"]  # millet_sorghum
    label_aliases: {CSB: ["Sorghum"]}
    kc_ini: {value: 0.3, ref: {source: fao56_ch6, table: 12, row: "i. Cereals (group row, Kc ini)", footnote: 1}, verified: true}
    kc_mid: {value: 1.05, range: [1.00, 1.10], ref: {source: fao56_ch6, table: 12, row: "Sorghum - grain"}, verified: true,
             choice: "Midpoint of the printed range; no footnote guides the choice (A)."}
    kc_end: {value: 0.55, ref: {source: fao56_ch6, table: 12, row: "Sorghum - grain"}, verified: true}
    h_max_m: {range: [1, 2], ref: {source: fao56_ch6, table: 12, row: "Sorghum - grain"}, verified: true}
    root_depth_m: {range: [1.0, 2.0], ref: {source: fao56_ch8, table: 22, row: "Sorghum - grain"}, verified: true}
    p: {value: 0.55, ref: {source: fao56_ch8, table: 22, row: "Sorghum - grain", note: "for ET ≈ 5 mm/day"}, verified: true}
    ky: {value: 0.9, ref: {source: fao56_ch8, table: 24, row: "Sorghum", note: "from FAO-33"}, verified: true}
    stage_lengths_days:
      ks_t14slh: {value: [20, 35, 40, 30], ref: {source: fao56_ch6, table: 11, row: "Sorghum | May/June | USA, Pakis., Med."}, verified: true}
      fr_toulouse_t31tcj: {value: [20, 35, 40, 30], ref: {source: fao56_ch6, table: 11, row: "Sorghum | May/June | USA, Pakis., Med."}, verified: true}
    family: {value: Poaceae, verified: true, ref: {source: gbif_backbone, usage_key: 2705181, scientific_name: "Sorghum bicolor (L.) Moench", match_type: EXACT, name_source: "FAO-66 (Steduto et al. 2012), PDF p. 159", usda_symbol: SOBI2, usda_family_agrees: true, accessed: 2026-11-04}}

  winter_wheat:
    name: Winter wheat (soft and durum)
