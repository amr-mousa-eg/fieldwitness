repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      # Installed gitleaks CLI v8.30.1 (PLAN.md T0.1); same command as upstream's gitleaks-system
      # hook, declared locally because the remote hook failed on Windows with "received 2 args".
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
