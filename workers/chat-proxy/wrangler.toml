# FieldWitness chat proxy (Cloudflare Workers free plan). See README.md in this folder.
name = "fieldwitness-chat-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://amr-mousa-eg.github.io"
# Default: Google Gemini free tier through its OpenAI-compatible endpoint (docs/api_notes.md).
LLM_PROVIDER = "google"
LLM_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
LLM_MODEL = "gemini-3.5-flash-lite"
# Groq free tier instead (no code change):
# LLM_PROVIDER = "groq"
# LLM_BASE_URL = "https://api.groq.com/openai/v1"
# LLM_MODEL = "llama-3.3-70b-versatile"
MAX_TOKENS = "400"
DAILY_CAP = "500"
# Optional, Gemini thinking models only: uncomment if replies come back empty.
# LLM_REASONING_EFFORT = "low"

# Per-IP limit: 10 questions per 60 s (approximate, counted per Cloudflare location).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "20261114"

  [ratelimits.simple]
  limit = 10
  period = 60

# Daily cap counter. Create it with `npx wrangler kv namespace create USAGE`,
# then uncomment and paste the id it prints. Without it, only the per-IP limit applies.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<paste the id here>"
