name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (pinned, checksum-verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .
