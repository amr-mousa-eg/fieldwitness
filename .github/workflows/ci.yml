name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Validate demo packs
        run: |
          if [ -d packs/demo ]; then uv run python -m fieldwitness.cli validate-packs packs/demo; else echo "no packs/demo yet"; fi

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (pinned, checksum-verified)
        run: |
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          checksums=gitleaks_${GITLEAKS_VERSION}_checksums.txt
          gh release download v${GITLEAKS_VERSION} --repo gitleaks/gitleaks --pattern "$tarball" --pattern "$checksums" || {
            base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
            curl -sSfLO --retry 3 "$base/$tarball" || curl -sSL -H "Accept: application/octet-stream" -o "$tarball" "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058"
            curl -sSfLO --retry 3 "$base/$checksums" || curl -sSL -H "Accept: application/octet-stream" -o "$checksums" "https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378333193"
          }
          grep " $tarball\$" "$checksums" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .
